<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinetic Portrait</title>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Noto+Sans+JP:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#060608;--gold:#d6336c;--tx:#fff;--mut:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(circle,#2b0410,var(--bg));font-family:'Noto Sans JP','Syncopate',sans-serif;display:flex;justify-content:center;align-items:center;overflow:hidden;color:var(--tx);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.stage{width:95vw;height:min(53.43vw,675px);max-width:1200px;min-height:420px;display:grid;grid-template-columns:42% 44% 14%;position:relative;overflow:hidden;border-radius:12px;background:#12030a;border:1px solid rgba(255,255,255,.06);box-shadow:0 30px 100px rgba(0,0,0,.8),inset 0 0 80px rgba(6,6,8,.9)}
.stage::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,transparent 40%,rgba(6,6,8,.85));z-index:12;pointer-events:none}
.glow{position:absolute;inset:-10%;background:radial-gradient(circle at 15% 55%,rgba(255,0,140,.35),transparent 40%),radial-gradient(circle at 90% 50%,rgba(255,30,30,.3),transparent 40%);will-change:transform;transition:transform .4s}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.04) 15%,transparent 16%);background-size:6px 6px;z-index:2;pointer-events:none}
.bg-text{position:absolute;width:200%;top:45%;font-family:Syncopate,sans-serif;font-size:clamp(5rem,14vw,14rem);color:rgba(255,80,120,.04);letter-spacing:30px;white-space:nowrap;animation:slide 35s linear infinite;z-index:1}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:11;pointer-events:none}
.left{position:relative;z-index:5;padding:5% 7%;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(90deg,rgba(6,6,8,.98),rgba(70,3,20,.6) 75%,transparent)}
.q{font-size:clamp(.5rem,.9vw,.75rem);font-weight:900;letter-spacing:2px;text-transform:uppercase;line-height:1.5;border-left:3px solid var(--gold);padding-left:10px;color:#cbd5e1}
.sub{display:block;font-size:clamp(.6rem,1vw,.95rem);font-weight:900;letter-spacing:6px;margin-bottom:8px}
h1{font-size:clamp(3rem,9vw,8.5rem);font-weight:900;line-height:.9;letter-spacing:-4px;text-shadow:1px 1px 0 var(--gold),2px 2px 0 #8a1b44,3px 3px 0 #5e1030,5px 5px 25px #000}
.badge{display:inline-block;background:#fff;color:#000;padding:4px 16px;font-size:.8rem;font-weight:700;letter-spacing:3px;margin-top:12px;border-radius:2px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.meta{font-size:.6rem;color:#64748b;font-weight:700;letter-spacing:2px}
.tag{border:1px solid rgba(255,255,255,.4);padding:4px 14px;font-size:.6rem;font-weight:700;letter-spacing:2px}
.center{position:relative;z-index:4;display:flex;justify-content:center}
.win{position:absolute;inset:5% 4%;border:1px solid rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.win::after{content:'';position:absolute;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,rgba(214,51,108,.5),#fff,rgba(214,51,108,.5),transparent);animation:scan 4s linear infinite;z-index:2}
.tech{position:absolute;right:20px;top:22%;z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font:.55rem monospace;color:rgba(255,255,255,.35)}
.pulse{width:40px;height:2px;background:var(--gold);animation:bar 1.2s infinite ease-in-out}
.char{position:absolute;bottom:0;left:-8%;width:116%;height:112%;z-index:10;pointer-events:none;will-change:transform}
.char img{width:100%;height:100%;object-fit:cover;object-position:top center;animation:float 6s ease-in-out infinite;
-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent 100%),linear-gradient(to right,transparent,#000 18%,#000 82%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,#000 70%,transparent 100%),linear-gradient(to right,transparent,#000 18%,#000 82%,transparent);mask-composite:intersect;filter:drop-shadow(0 0 50px rgba(255,30,90,.2))}
.right{position:relative;z-index:15;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:40px 10px}
.pill{border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 16px;font-size:.65rem;letter-spacing:2px;font-weight:700}
.vt{writing-mode:vertical-rl;display:flex;align-items:center;gap:14px}
.vt b{font-size:clamp(1.2rem,2.2vw,2.2rem);font-weight:900;letter-spacing:10px}
.vt span{font-size:.7rem;letter-spacing:6px;color:rgba(255,255,255,.5);cursor:pointer;transition:color .3s}
.vt span:hover{color:#fff}
.dia{color:var(--gold);animation:glow 2s infinite}
@keyframes slide{to{transform:translateX(-50%)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes scan{0%{top:0;opacity:0}5%,95%{opacity:1}100%{top:100%;opacity:0}}
@keyframes bar{50%{width:45px}0%,100%{width:15px}}
@keyframes glow{0%,100%{opacity:.3}50%{opacity:1}}
@media(max-width:700px){.stage{grid-template-columns:1fr 0 0;height:90vh}.center{position:absolute;inset:0;z-index:3}.left{z-index:6;background:linear-gradient(0deg,rgba(6,6,8,.95),transparent 60%);justify-content:flex-end;gap:12px}.q,.foot,.right{display:none}.char{left:-10%;width:120%}}
</style></head><body>

<script>
const st=document.getElementById('stage'),ch=document.getElementById('char'),gl=document.getElementById('glow');
let mx=0,my=0,cx=0,cy=0,px=0;
addEventListener('mousemove',e=>{mx=(e.clientX-innerWidth/2)/(innerWidth/2);my=(e.clientY-innerHeight/2)/(innerHeight/2)});
(function f(){cx+=(mx*18-cx)*.08;cy+=(my*12-cy)*.08;px+=(-mx*10-px)*.05;
ch.style.transform=`translate(${cx}px,${cy}px)`;gl.style.transform=`translate(${-cx*1.5}px,${-cy*1.5}px)`;requestAnimationFrame(f)})();
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rs(){cv.width=st.clientWidth;cv.height=st.clientHeight}addEventListener('resize',rs);rs();
const cols=['rgba(255,60,110,.3)','rgba(249,115,22,.22)','rgba(254,205,211,.28)'];
class P{constructor(){this.r(1)}
r(i){this.x=Math.random()*cv.width;this.y=i?Math.random()*-cv.height:-10;this.s=Math.random()*5+3;this.vy=Math.random()*.7+.3;this.vx=Math.random()*.4-.2;this.a=Math.random()*360;this.sp=Math.random()*.8-.4;this.c=cols[Math.random()*3|0]}
u(){this.y+=this.vy;this.x+=this.vx+Math.sin(this.y/40)*.25+px*.02;this.a+=this.sp;if(this.y>cv.height+10)this.r(0)}
d(){x.save();x.translate(this.x,this.y);x.rotate(this.a*Math.PI/180);x.fillStyle=this.c;x.beginPath();x.ellipse(0,0,this.s,this.s/1.8,0,0,7);x.fill();x.restore()}}
const ps=Array.from({length:30},()=>new P());
(function a(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.u();p.d()});requestAnimationFrame(a)})();
</script></body></html>
